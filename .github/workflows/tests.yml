name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The app and its tests are Windows-only (PyQt6 desktop, ctypes.wintypes, Credential Manager)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: pytest (debug - shutdown exit code)
        run: |
          $codes = @()
          foreach ($args_ in @(@('-q'), @('-q'), @('-q'), @('-q', '-p', 'no:faulthandler'), @('-q', '-p', 'no:faulthandler'), @('-q', '-p', 'no:faulthandler'))) {
            python -m pytest @args_ 2>&1 | Select-Object -Last 3
            "EXITCODE [$($args_ -join ' ')]: $LASTEXITCODE"
            $codes += $LASTEXITCODE
          }
          "ALL: $($codes -join ' ')"
          Get-ChildItem "$env:TEMP\pytest-of-*" -Recurse -Filter crash.log -ErrorAction SilentlyContinue |
            Where-Object Length -gt 0 | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName }
          exit 0
